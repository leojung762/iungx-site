server {
    listen 80;
    listen [::]:80;

    server_name iungx.space www.iungx.space;
    root /var/www/iungx.space/current;
    index index.html;

    access_log /var/log/nginx/iungx.space.access.log;
    error_log /var/log/nginx/iungx.space.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
